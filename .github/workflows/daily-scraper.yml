name: Daily War Thunder scraper

on:
  schedule:
    # 03:30 UTC = 07:00 Iran Standard Time (UTC+3:30) year-round — Iran
    # does not observe DST, so this stays correct without a seasonal
    # adjustment. GitHub's cron scheduler runs on a shared queue and can
    # be delayed by several minutes at busy times; don't rely on the
    # exact minute if that ever matters downstream.
    - cron: "30 3 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, e.g. to test after a selector fix

# Only one scrape should ever run at a time — overlapping runs would race
# on the same MongoDB upserts for no benefit.
concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # generous but bounded — a scraper that can hang forever isn't "zero-maintenance", it's a silent cost leak

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-daily-scraper.txt

      - name: Install Playwright's Chromium + OS deps
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/daily_scraper.py --category all

      - name: Trigger Next.js cache revalidation
        if: success()
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        # Best-effort: the unstable_cache-based revalidate below (1h) means
        # the site self-heals even if this step is skipped or fails — this
        # is purely to make new data show up in minutes instead of up to
        # an hour. Missing secrets are skipped, not fatal — this step is
        # optional infrastructure, the scrape above is the part that
        # actually matters.
        run: |
          if [ -z "$REVALIDATE_URL" ]; then
            echo "REVALIDATE_URL secret not set — skipping (data will still refresh within the hour via unstable_cache)."
            exit 0
          fi
          curl -sf -X POST "$REVALIDATE_URL" \
            -H "Content-Type: application/json" \
            -d "{\"secret\": \"$REVALIDATE_SECRET\"}" \
            || echo "Revalidation ping failed — non-fatal, continuing."

      - name: Upload scrape log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-failure-log
          path: |
            *.log
          if-no-files-found: ignore
