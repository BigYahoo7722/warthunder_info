name: Scraper - Ground Forces

on:
  schedule:
    - cron: "30 3 * * 2"
  workflow_dispatch: {}

concurrency:
  group: scraper-ground
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/requirements-daily-scraper.txt
      - name: Install Playwright
        run: playwright install --with-deps chromium
      - name: Run Ground scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/daily_scraper.py --category ground
      - name: Trigger Revalidation
        if: success()
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          [ -z "$REVALIDATE_URL" ] && exit 0
          curl -sf -X POST "$REVALIDATE_URL" -H "Content-Type: application/json" -d "{\"secret\": \"$REVALIDATE_SECRET\"}" || echo "Revalidation failed"
      - name: Log failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-failure-ground
          path: *.log
