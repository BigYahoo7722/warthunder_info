name: Scraper - Helicopters

on:
  schedule:
    - cron: "30 3 * * 3"
  workflow_dispatch: {}

concurrency:
  group: scraper-helicopter
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-daily-scraper.txt

      - name: Install Playwright's Chromium + OS deps
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/daily_scraper.py --category helicopter

      - name: Trigger Next.js cache revalidation
        if: success()
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_URL" ]; then
            echo "REVALIDATE_URL secret not set — skipping."
            exit 0
          fi
          curl -sf -X POST "$REVALIDATE_URL" \
            -H "Content-Type: application/json" \
            -d "{\"secret\": \"$REVALIDATE_SECRET\"}" \
            || echo "Revalidation ping failed — non-fatal, continuing."

      - name: Upload scrape log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-failure-log-helicopter
          path: |
            *.log
          if-no-files-found: ignore
