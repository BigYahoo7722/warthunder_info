name: Scraper - Aviation

# Target: every Saturday at 2:00 AM America/New_York.
# GitHub Actions cron only understands fixed UTC, and it doesn't shift with
# US Daylight Saving Time — so we schedule BOTH UTC times that 2 AM
# New York can fall on (07:00 UTC in EST / winter, 06:00 UTC in EDT /
# summer), then the "Time gate" step below checks the real New York clock
# and skips everything else unless it's actually 2 AM there. Net effect:
# always fires once, always at the correct local time, year-round.
on:
  schedule:
    - cron: "0 7 * * 6" # 2:00 AM EST (winter)
    - cron: "0 6 * * 6" # 2:00 AM EDT (summer)
  workflow_dispatch: {}

concurrency:
  group: scraper-aviation
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Time gate (only proceed at 2 AM America/New_York)
        id: gate
        run: |
          hour=$(TZ="America/New_York" date +%H)
          echo "Current New York hour: $hour"
          if [ "$hour" = "02" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: pip install -r scripts/requirements-daily-scraper.txt

      - name: Install Playwright's Chromium + OS deps
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: playwright install --with-deps chromium

      - name: Run scraper
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/daily_scraper.py --category aviation

      - name: Trigger Next.js cache revalidation
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true') && success()
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_URL" ]; then
            echo "REVALIDATE_URL secret not set — skipping."
            exit 0
          fi
          curl -sf -X POST "$REVALIDATE_URL" \
            -H "Content-Type: application/json" \
            -d "{\"secret\": \"$REVALIDATE_SECRET\"}" \
            || echo "Revalidation ping failed — non-fatal, continuing."

      - name: Upload scrape log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-failure-log-aviation
          path: |
            *.log
          if-no-files-found: ignore
